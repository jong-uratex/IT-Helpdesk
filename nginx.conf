# NGINX Configuration for Uratex IT Service Desk
# Ubuntu 22.04 LTS (/etc/nginx/sites-available/uratex)

server {
    listen 80;
    listen 443 ssl http2;
    server_name ticketing.uratex.com.ph; # Replace with your domain or IP 10.0.115.101

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 8M;

    # Protect SQLite database files
    location ^~ /data/ {
        deny all;
        return 403;
    }

    location ~ \.(sqlite|db|sql|log)$ {
        deny all;
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to FastCGI server (PHP-FPM)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock; # Adjust to your PHP version sock
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
